<!doctype html>
<html lang="en">

    <meta name="color-scheme" content="light dark" />

      as="font"

      crossorigin="anonymous"
    />

      rel="preload"
      href="/fonts/inter-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
