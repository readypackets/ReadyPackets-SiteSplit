# ReadyPackets Portal — nginx reverse proxy
#
# This file terminates TLS and forwards to the Node process. It deliberately
# does not set security response headers: the application sets them itself,
# including a per-request CSP nonce, and duplicating them here would produce
# conflicting policies. The one exception is HSTS, which is safe to assert at
# the edge.
#
# Install on a VPS:
#   cp deploy/nginx.conf /etc/nginx/sites-available/readypackets
#   ln -s /etc/nginx/sites-available/readypackets /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The installer substitutes the canonical hostname, approved portal aliases, and
# strict host allowlist. Do not hand-edit generated /etc/nginx configuration.

# Upstream keeps a warm connection pool to the app.
upstream readypackets_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limiting at the edge, in front of the application's own limiter. This
# first line of defence sheds a flood before it costs Node any CPU.
limit_req_zone $binary_remote_addr zone=rp_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=rp_auth:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=rp_conn:10m;

# Fail closed for unrecognised HTTP Host headers rather than reflecting them in
# a redirect. Configured portal names use the following server block.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 421;
}

# Redirect configured plain-HTTP portal names, and serve the ACME challenge.
server {
    listen 80;
    listen [::]:80;
    server_name __RP_HTTP_SERVER_NAMES__;

    # This block is the first thing any scanner touches, so it must not disclose
    # the version either. `server_tokens off` alone still emits "Server: nginx";
    # the installer substitutes more_clear_headers below when the module exists.
    server_tokens off;
    # __RP_MORE_CLEAR_HEADERS__

    # Certbot writes its challenge here.
    # `^~` prevents the security regex that blocks hidden paths from
    # intercepting `.well-known` before Certbot can serve HTTP-01 tokens.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        # Keep HTTP-01 above this location. The target is a literal canonical
        # hostname; it never reflects an untrusted Host header.
        return 308 https://__RP_CANONICAL_DOMAIN__$request_uri;
    }
}

# Nginx selects a TLS virtual host before it can evaluate the HTTP Host header.
# Keep an explicit default that cannot proxy an unknown SNI/Host into Node.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    include /etc/readypackets/tls/nginx-tls.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519:secp384r1;
    ssl_session_tickets off;
    server_tokens off;
    return 421;
}

# Explicit portal aliases terminate TLS only so that they can redirect directly
# to the literal canonical origin. They never contain proxy_pass and never reach
# application/session/CSRF handling.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __RP_PORTAL_ALIAS_SERVER_NAMES__;
    include /etc/readypackets/tls/nginx-tls.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519:secp384r1;
    ssl_session_tickets off;
    server_tokens off;
    # __RP_MORE_CLEAR_HEADERS__
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    return 308 https://__RP_CANONICAL_DOMAIN__$request_uri;
}

server {
    # HTTP/2 is enabled on the listen directive rather than with `http2 on;`.
    # The standalone directive exists only from nginx 1.25, and Ubuntu 22.04 --
    # a very common target -- ships 1.18, where it is a fatal "unknown
    # directive" that stops the entire configuration from loading. Worse, a
    # `systemctl reload` in that state keeps serving the previous config, so the
    # failure is easy to miss. This form works from 1.9.5 onward; 1.25+ accepts
    # it and emits a deprecation warning.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __RP_APP_SERVER_NAMES__;

    # ---------------------------------------------------------------------
    # TLS
    # ---------------------------------------------------------------------
    # The installer creates this root-owned include from either a Let's Encrypt
    # certificate or a Cloudflare Origin CA certificate. Keeping the key paths
    # out of this tracked template allows a validated, atomic provider switch.
    include /etc/readypackets/tls/nginx-tls.conf;

    # TLS 1.2 and 1.3 only. Everything older is broken.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519:secp384r1;

    ssl_session_timeout 1d;
    ssl_session_cache shared:RP_TLS:10m;
    ssl_session_tickets off;

    # OCSP stapling.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # HSTS is asserted at the edge. Remove `preload` until you are certain every
    # subdomain can serve HTTPS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # `server_tokens off` hides the version but still emits "Server: nginx". The
    # application strips its own identifying headers, so leaving the product name
    # at the edge would undo that for no benefit. Requires the headers-more module
    # (nginx-extras); where it is absent nginx ignores an unknown directive inside
    # a server block only if the module is compiled in, so this is applied by the
    # installer after checking, rather than unconditionally here.
    server_tokens off;
    # __RP_MORE_CLEAR_HEADERS__

    # Reject unexpected Host headers for the canonical portal and any separately
    # hosted public surface. Alias hosts are selected by their own server block
    # above and cannot enter this application server.
    # __RP_APP_HOST_REGEX__ is substituted by the installer with the domain, dots
    # escaped. It is a distinct token rather than the hostname itself because a
    # plain-text substitution of "portal.readypackets.com" does not match the
    # regex-escaped form "portal\.readypackets\.com", which previously left this
    # check rejecting the very host the server was installed to serve.
    if ($host !~* ^(__RP_APP_HOST_REGEX__)$) {
        return 421;
    }

    # Only the methods the application actually implements.
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
        return 405;
    }

    client_max_body_size 55m;      # slightly above MAX_UPLOAD_BYTES
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 16k;

    limit_conn rp_conn 40;

    # Compression. `gzip_proxied` excludes responses that must not be cached.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/manifest+json;

    access_log /var/log/nginx/readypackets.access.log;
    error_log  /var/log/nginx/readypackets.error.log warn;

    # ---------------------------------------------------------------------
    # Proxy configuration shared by all locations
    # ---------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    # Never forward a client-supplied value for these.
    proxy_set_header X-Forwarded-Server "";
    proxy_hide_header X-Powered-By;
    proxy_redirect off;
    proxy_buffering on;
    proxy_read_timeout 65s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 65s;

    # ---------------------------------------------------------------------
    # Locations
    # ---------------------------------------------------------------------

    # Authentication endpoints get the tightest edge budget.
    location ~ ^/api/trpc/auth\. {
        limit_req zone=rp_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://readypackets_app;
    }

    # Uploads and downloads must not be buffered to disk by nginx.
    location /api/files/ {
        limit_req zone=rp_general burst=20 nodelay;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://readypackets_app;
    }

    location /api/ {
        limit_req zone=rp_general burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://readypackets_app;
    }

    # Hashed build assets are immutable, so they can be cached aggressively.
    location /assets/ {
        proxy_pass http://readypackets_app;
        proxy_cache_valid 200 30d;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location /fonts/ {
        proxy_pass http://readypackets_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location /brand/ {
        proxy_pass http://readypackets_app;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # Block probes for common sensitive paths before they reach the app.
    location ~ /\.(env|git|svn|hg|ht) {
        deny all;
        return 404;
    }

    location ~* \.(sql|bak|old|orig|swp|log|ini|conf|yaml|yml)$ {
        deny all;
        return 404;
    }

    # Everything else is the single-page application shell.
    location / {
        limit_req zone=rp_general burst=60 nodelay;
        proxy_pass http://readypackets_app;
    }
}
