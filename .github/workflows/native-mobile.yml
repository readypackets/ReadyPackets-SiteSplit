name: Native mobile validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-contract:
    name: Mobile API contract and source safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run tests/mobileContract.test.ts --reporter=verbose

  android:
    name: Android API 36 compile and tests
    runs-on: ubuntu-latest
    needs: mobile-contract
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36 build prerequisites
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Compile and test without a signing key
        working-directory: mobile/android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  ios:
    name: iOS simulator build
    runs-on: macos-15
    needs: mobile-contract
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile unsigned simulator build
        working-directory: mobile/ios/ReadyPackets
        run: >-
          xcodebuild -project ReadyPackets.xcodeproj -scheme ReadyPackets
          -sdk iphonesimulator -configuration Debug
          CODE_SIGNING_ALLOWED=NO build

# Store signing keys, APNs credentials, Android upload keys, portal environment
# values, redirect-domain association files, and production secrets are not CI
# repository inputs. They are supplied only through protected release systems.
